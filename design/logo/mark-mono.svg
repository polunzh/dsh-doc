<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-label="Print Studio">
  <!-- 打印机顶部进纸 -->
  <path d="M6.5 9V3.5a1 1 0 0 1 1-1h9a1 1 0 0 1 1 1V9" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 打印机主体 -->
  <rect x="2.5" y="8.5" width="19" height="8.5" rx="2.2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 状态指示灯 -->
  <circle cx="17.5" cy="11.8" r="0.8" fill="currentColor"/>
  <!-- 打印出纸及托盘 -->
  <path d="M6 14v6.5a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1V14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 纸张上已打印出来的排版内容行 -->
  <line x1="8.5" y1="17.5" x2="15.5" y2="17.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="8.5" y1="19.5" x2="13" y2="19.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
</svg>
